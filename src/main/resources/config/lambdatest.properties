# LambdaTest real-device cloud. Credentials come from env vars LT_USERNAME / LT_ACCESS_KEY.
# Upload the APK once to LambdaTest and pass its id: -Dlt.app=lt://APP_ID
run.target=lambdatest
appium.server.url=https://mobile-hub.lambdatest.com/wd/hub
platform.version=14
device.name=Galaxy S23
lt.app=lt://REPLACE_WITH_APP_ID
lt.build=Appium Java Showcase
app.package=com.saucelabs.mydemoapp.rn
app.activity=.MainActivity
explicit.wait.seconds=20
new.command.timeout.seconds=180
retry.count=1
