# Local Android emulator + Appium 2 server (appium --base-path / default)
run.target=local
appium.server.url=http://127.0.0.1:4723
platform.version=14
device.name=emulator-5554
app.path=apps/my-demo-app.apk
app.package=com.saucelabs.mydemoapp.rn
app.activity=.MainActivity
explicit.wait.seconds=15
new.command.timeout.seconds=120
retry.count=1
